[package]
name = "pumpkin-hybrid-compat"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(target_os = "linux")'.dependencies]
cafebabe = "0.9.0"
cranelift-codegen = { version = "=0.137.1", default-features = false, features = ["std", "host-arch"] }
cranelift-frontend = "=0.137.1"
cranelift-module = "=0.137.1"
cranelift-native = "=0.137.1"
cranelift-object = "=0.137.1"
libloading = "0.9.0"
sha2 = "0.11"
tempfile = "3"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
